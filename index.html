<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSGame Support</title>
  <meta name="description" content="Official support and privacy information for HSGame on iOS.">
  <style>
    :root { color-scheme: dark; --bg:#090c17; --card:#151a2b; --text:#f7f8ff; --muted:#aeb7d0; --blue:#4da3ff; --red:#ff4d5f; --green:#54d7a0; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top,#22234c,var(--bg) 55%); color:var(--text); }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:72px 0; }
    .mark { display:flex; gap:8px; margin-bottom:22px; }
    .mark span { width:38px; height:8px; border-radius:20px; }
    h1 { font-size:clamp(40px,10vw,72px); line-height:.95; margin:0 0 18px; letter-spacing:-.05em; }
    p { color:var(--muted); }
    .card { margin-top:28px; padding:24px; border:1px solid #303854; border-radius:20px; background:rgba(21,26,43,.92); }
    nav { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:28px; }
    a { color:var(--text); text-decoration:none; font-weight:750; }
    nav a { padding:16px 18px; border-radius:14px; background:#252d48; }
    nav a:hover { background:#303a5d; }
    footer { margin-top:34px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark"><span style="background:var(--blue)"></span><span style="background:var(--red)"></span><span style="background:var(--green)"></span></div>
    <h1>HSGame</h1>
    <p>Runner, Combat, Shooter, and Rover in one offline-first iOS arcade.</p>
    <section class="card">
      <h2>Support</h2>
      <p>For gameplay help, privacy requests, or advertising reports, contact <a href="mailto:muratkucuk1844@icloud.com?subject=HSGame%20Support">muratkucuk1844@icloud.com</a>.</p>
      <nav>
        <a href="privacy.html">Privacy Policy</a>
        <a href="support.html">Support &amp; Ad Reports</a>
      </nav>
    </section>
    <footer>© 2026 HSGame. Last updated August 27, 2026.</footer>
  </main>
</body>
</html>
